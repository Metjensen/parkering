<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staldplads til din hestekraft</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3e2b8;
            font-family: Georgia, serif;
            color: #173d25;
            text-align: center;
        }

        .kort {
            width: min(600px, 85%);
            padding: 45px 30px;
            background: #fff5d9;
            border: 5px solid #173d25;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.20);
        }

        .ikon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 38px;
            color: #173d25;
        }

        .undertekst {
            font-size: 22px;
            line-height: 1.5;
        }

        .lille {
            margin-top: 30px;
            font-size: 16px;
            opacity: 0.75;
        }
    </style>
</head>

<body>

<div class="kort">
    <div class="ikon">🏎️ 🐎</div>

    <h1>STALDPLADS TIL DIN HESTEKRAFT</h1>

    <div class="undertekst" id="besked">
        Stalden er endnu ikke åben.<br><br>
        Kom tilbage den 9. september efter kl. 12:00.<br>
        Parkeringsmesteren holder porten lukket lidt endnu. 🔐
    </div>

    <div class="lille">
        Seminar 9.–10. september 2026
    </div>
</div>

<script>
    const nu = new Date();

    // Dansk sommertid (CEST = UTC+2)
    const aabner = new Date("2026-09-01T12:00:00+02:00");
    const lukker = new Date("2026-09-10T12:00:00+02:00");

    const parkering =
        "https://tilmelding.apcoa.dk/legoland/hotel-legoland";

    if (nu >= aabner && nu < lukker) {

        document.getElementById("besked").innerHTML =
            "Porten er åben! 🏰<br><br>Du sendes videre til parkeringsregistreringen...";

        setTimeout(function () {
            window.location.href = parkering;
        }, 1200);

    } else if (nu >= lukker) {

        document.getElementById("besked").innerHTML =
            "Stalden er lukket. 🐎<br><br>Tak for denne gang – alle hestekræfter er sendt godt hjem.";

    }
</script>

</body>
</html>
