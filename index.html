<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staldplads til din hestekraft</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #f3e2b8;
            font-family: Georgia, serif;
            color: #173d25;
            text-align: center;
        }

        .kort {
            width: min(650px, 86%);
            padding: 45px 30px;
            background: #fff5d9;
            border: 5px solid #173d25;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.20);
            position: relative;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 38px;
            color: #173d25;
        }

        .undertekst {
            font-size: 22px;
            line-height: 1.5;
        }

        .lille {
            margin-top: 30px;
            font-size: 16px;
            opacity: 0.75;
        }

        .lego-linje {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .klods {
            width: 34px;
            height: 22px;
            border-radius: 4px;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18);
        }

        .groen { background: #176b3a; }
        .roed  { background: #b52b22; }
        .blaa  { background: #215b9b; }
        .gul   { background: #d9a514; }

        .hestezone {
            height: 100px;
            margin: 15px 0 5px;
            position: relative;
            overflow: visible;
        }

        .bil {
            position: absolute;
            left: 37%;
            top: 30px;
            font-size: 42px;
        }

        .hest {
    position: absolute;
    left: 50%;
    top: 10px;
    font-size: 58px;
    transform: scaleX(-1);
}

.galop {
    animation: galop 3.4s linear forwards;
}

@keyframes galop {
    0% {
        left: 50%;
        top: 10px;
    }

    15% {
        left: 60%;
        top: 0px;
    }

    30% {
        left: 72%;
        top: 12px;
    }

    45% {
        left: 85%;
        top: 0px;
    }

    60% {
        left: 100%;
        top: 12px;
    }

    75% {
        left: 115%;
        top: 0px;
    }

    100% {
        left: 150%;
        top: 10px;
    }
}
        
        .aaben {
            font-weight: bold;
            font-size: 27px;
            color: #173d25;
        }
    </style>
</head>

<body>

<div class="kort">

    <div class="lego-linje">
        <div class="klods groen"></div>
        <div class="klods roed"></div>
        <div class="klods blaa"></div>
        <div class="klods gul"></div>
    </div>

    <h1>STALDPLADS TIL DIN HESTEKRAFT</h1>

    <div class="hestezone">
        <div class="bil">🏎️</div>
        <div class="hest" id="hest">🐎</div>
    </div>

    <div class="undertekst" id="besked">
        Stalden er endnu ikke åben.<br><br>
        Kom tilbage den 9. september efter kl. 12:00.<br>
        Parkeringsmesteren holder porten lukket lidt endnu. 🔐
    </div>

    <div class="lille">
        Seminar 9.–10. september 2026
    </div>

</div>

<script>
    const nu = new Date();

    const aabner = new Date("2026-09-01T12:00:00+02:00");
    const lukker = new Date("2026-09-10T12:00:00+02:00");

    const parkering =
        "https://tilmelding.apcoa.dk/legoland/hotel-legoland";

    if (nu >= aabner && nu < lukker) {

        document.getElementById("besked").innerHTML =
            '<span class="aaben">PORTEN ER ÅBEN! 🏰</span><br><br>' +
            'Din hestekraft er sluppet løs.<br>' +
            'Du sendes videre til parkeringsregistreringen...';

        document.getElementById("hest").classList.add("galop");

        setTimeout(function () {
            window.location.href = parkering;
        }, 4200);

    } else if (nu >= lukker) {

        document.getElementById("besked").innerHTML =
            "Stalden er lukket. 🐎<br><br>" +
            "Tak for denne gang – alle hestekræfter er sendt godt hjem.";
    }
</script>

</body>
</html>
